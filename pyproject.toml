[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-agent-lab"
version = "0.4.0"
description = "Grounded research agent with trust-separated retrieval, LangGraph wrap, read-only MCP tools, and a fixture retrieval shootout."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agents", "rag", "retrieval", "evaluation", "provenance"]
authors = [
    { name = "Cameron Sanderson" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6,<3",
    "langgraph>=0.6,<0.7",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.15,<1",
]
embeddings = [
    "sentence-transformers>=3.0,<4",
]

[project.scripts]
grounded-agent = "grounded_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:The default value of `allowed_objects` will change:PendingDeprecationWarning",
    "ignore:Field 'lifespan' has an incomplete definition",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
