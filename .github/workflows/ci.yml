name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene-and-leak-check:
    name: Path and secret leak audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify no absolute machine path leaks
        run: |
          if git grep -n -E "(\/Users\/[a-zA-Z0-9_\.-]+|\/home\/[a-zA-Z0-9_\.-]+|\/private\/var\/[a-zA-Z0-9_\.-]+)" -- ':!.github' ':!tests/fixtures'; then
            echo "ERROR: hardcoded absolute local machine path leaks"
            exit 1
          fi

      - name: Verify no staged secret tokens
        run: |
          if git grep -n -E "(sk-ant-[a-zA-Z0-9_-]{20,}|sk-[a-zA-Z0-9]{24,}|ghp_[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16})" -- ':!.github' ':!tests/fixtures'; then
            echo "ERROR: potential live secrets in the tree"
            exit 1
          fi

  test-and-lint:
    name: ruff and pytest (py${{ matrix.python-version }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        dependencies: [minimum, current]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.dependencies }}" = "minimum" ]; then
            python -m pip install -e ".[dev]" -c constraints/mcp-minimum.txt --report resolution.json
          else
            python -m pip install --upgrade -e ".[dev]" --report resolution.json
          fi
      - name: Check resolved dependencies and imports
        env:
          DEPENDENCY_CONFIGURATION: ${{ matrix.dependencies }}
        run: |
          python -m pip check
          python -m pip freeze > installed.txt
          python - <<'PYTHON'
          import importlib.metadata as metadata
          import json
          import os
          import sys
          import tomllib
          from pathlib import Path
          import grounded_agent
          import grounded_agent.graph
          from grounded_agent.mcp_server import build_harbor_mcp
          from mcp.server.fastmcp.tools import ToolManager
          versions = {name: metadata.version(name) for name in (
              "grounded-agent-lab", "mcp", "pydantic", "langgraph", "pytest", "ruff"
          )}
          declared = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert versions["grounded-agent-lab"] == grounded_agent.__version__ == declared
          if os.environ["DEPENDENCY_CONFIGURATION"] == "minimum":
              assert versions["mcp"] == "1.21.1"
              assert versions["pydantic"] == "2.14.1"
          server = build_harbor_mcp()
          assert isinstance(server.tool_registry, ToolManager)
          assert server.tool_registry.frozen
          payload = {"python": sys.version, "configuration": os.environ["DEPENDENCY_CONFIGURATION"], "versions": versions}
          Path("dependency-versions.json").write_text(json.dumps(payload, indent=2) + "\n")
          print(json.dumps(payload, indent=2))
          PYTHON
      - name: Collect all deterministic tests
        run: python -m pytest --collect-only -q > collected.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Original audit regression assertions
        run: python -m pytest -q --runxfail tests/test_audit_regressions.py
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Preserve dependency and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-py${{ matrix.python-version }}-${{ matrix.dependencies }}
          path: |
            resolution.json
            installed.txt
            dependency-versions.json
            collected.txt
            test-results.xml

  installed-wheel-smoke:
    name: Installed wheel smoke (py${{ matrix.python-version }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        dependencies: [minimum, current]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Select dependency configuration
        if: matrix.dependencies == 'minimum'
        run: echo "PIP_CONSTRAINT=$GITHUB_WORKSPACE/constraints/mcp-minimum.txt" >> "$GITHUB_ENV"
      - name: Build the wheel, install it outside the checkout, and run the demo
        run: python scripts/smoke_wheel.py
