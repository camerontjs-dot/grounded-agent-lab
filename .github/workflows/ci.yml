name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene-and-leak-check:
    name: Path and secret leak audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify no absolute machine path leaks
        run: |
          if git grep -n -E "(\/Users\/[a-zA-Z0-9_\.-]+|\/home\/[a-zA-Z0-9_\.-]+|\/private\/var\/[a-zA-Z0-9_\.-]+)" -- ':!.github' ':!tests/fixtures'; then
            echo "ERROR: hardcoded absolute local machine path leaks"
            exit 1
          fi

      - name: Verify no staged secret tokens
        run: |
          if git grep -n -E "(sk-ant-[a-zA-Z0-9_-]{20,}|sk-[a-zA-Z0-9]{24,}|ghp_[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16})" -- ':!.github' ':!tests/fixtures'; then
            echo "ERROR: potential live secrets in the tree"
            exit 1
          fi

  test-and-lint:
    name: ruff and pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall src
